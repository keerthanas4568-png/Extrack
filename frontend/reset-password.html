<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Expense Tracker</title>

    <!-- Existing CSS files -->
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
</head>

<body class="auth-page">

    <main class="auth-page">

        <div class="auth-wrap">

            <section class="auth-card">

                <!-- Heading -->
                <div class="auth__head">

                    <h1 class="auth__title">
                        Reset Password
                    </h1>

                    <p class="auth__subtitle">
                        Enter your new password below.
                    </p>

                </div>


                <!-- Reset Password Form -->
                <form id="resetPasswordForm" class="auth__form">

                    <!-- New Password -->
                    <div class="field">

                        <label
                            for="newPassword"
                            class="field__label">
                            New Password
                        </label>

                        <div class="input-wrap">

                            <input
                                type="password"
                                id="newPassword"
                                class="field__input"
                                placeholder="Enter new password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="newPassword"
                                aria-label="Show password">

                                <span class="icon-eye">👁</span>
                                <span class="icon-eye-off">🙈</span>

                            </button>

                        </div>

                        <small
                            id="newPasswordError"
                            class="field__error">
                        </small>

                    </div>


                    <!-- Confirm Password -->
                    <div class="field">

                        <label
                            for="confirmPassword"
                            class="field__label">
                            Confirm Password
                        </label>

                        <div class="input-wrap">

                            <input
                                type="password"
                                id="confirmPassword"
                                class="field__input"
                                placeholder="Confirm new password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword"
                                aria-label="Show password">

                                <span class="icon-eye">👁</span>
                                <span class="icon-eye-off">🙈</span>

                            </button>

                        </div>

                        <small
                            id="confirmPasswordError"
                            class="field__error">
                        </small>

                    </div>


                    <!-- Reset Button -->
                    <button
                        type="submit"
                        id="resetPasswordBtn"
                        class="btn btn--block">

                        <span class="btn__label">
                            Reset Password
                        </span>

                        <span class="spinner"></span>

                    </button>

                </form>


                <!-- Success / Error Message -->
                <p
                    id="resetMessage"
                    class="auth__success">
                </p>


                <!-- Back to Login -->
                <div class="auth__switch">

                    <a
                        href="login.html"
                        class="auth__link">
                        Back to Login
                    </a>

                </div>

            </section>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="../js/reset-password.js"></script>

</body>

</html>
