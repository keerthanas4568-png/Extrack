<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Reset your Expense Tracker password."
  />

  <meta name="theme-color" content="#2563EB" />

  <title>Forgot Password — Expense Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>

<body class="auth-page">

  <main class="auth-wrap">

    <section class="auth-card" aria-labelledby="forgotHeading">

      <!-- Logo -->
      <a
        class="brand auth__brand"
        href="index.html"
        aria-label="Expense Tracker home"
      >
        <span class="brand__icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 3v18h18" />
            <path d="M7 14l4-4 3 3 5-6" />
          </svg>
        </span>

        <span class="brand__text">
          Expense<span class="brand__accent">Tracker</span>
        </span>
      </a>

      <!-- Heading -->
      <header class="auth__head">

        <h1 class="auth__title" id="forgotHeading">
          Forgot Password?
        </h1>

        <p class="auth__subtitle">
          Enter your registered email and we'll send you a password reset link.
        </p>

      </header>

      <!-- Forgot Password Form -->
      <form class="auth__form" id="forgotPasswordForm" novalidate>

        <!-- Email -->
        <div class="field">

          <label
            class="field__label"
            for="forgotEmail"
          >
            Email Address
          </label>

          <input
            class="field__input"
            type="email"
            id="forgotEmail"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
            aria-describedby="forgotEmailError"
          />

          <p
            class="field__error"
            id="forgotEmailError"
            role="alert"
            aria-live="polite"
          ></p>

        </div>

        <!-- Submit -->
        <button
          class="btn btn--primary btn--block"
          type="submit"
          id="forgotPasswordBtn"
        >
          <span class="btn__label">
            Send Reset Link
          </span>

          <span
            class="spinner"
            aria-hidden="true"
          ></span>
        </button>

      </form>

      <!-- Back to Login -->
      <p class="auth__switch">

        Remember your password?

        <a
          class="auth__link"
          href="login.html"
        >
          Back to Login
        </a>

      </p>

      <!-- Footer -->
      <footer class="auth__footer">

        <p>
          &copy;
          <span id="year">2026</span>
          Expense Tracker. All rights reserved.
        </p>

      </footer>

    </section>

  </main>

  <script src="../js/api.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/forgot-password.js"></script>

</body>
</html>
